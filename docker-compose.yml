version: "3.8"

services:

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "19120:19120"
    environment:
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://${MINIO_BUCKET}/
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/
      - nessie.catalog.service.s3.default-options.external-endpoint=http://localhost:9000/
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=${MINIO_ROOT_USER}
      - nessie.catalog.secrets.access-key.secret=${MINIO_ROOT_PASSWORD}
      - NESSIE_VERSION_STORE_TYPE=ROCKSDB
      - NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH=/var/lib/nessie/db
    volumes:
      - nessie_data:/var/lib/nessie/db
    depends_on:
      minio:
        condition: service_healthy

  trino:
    image: trinodb/trino
    container_name: trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - nessie
      - minio

  trino-worker:
    image: trinodb/trino
    container_name: trino-worker
    environment:
      TRINO_NODE_TYPE: worker
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/worker/node.properties:/etc/trino/node.properties
      - ./trino/worker/config.properties:/etc/trino/config.properties
    depends_on:
      - trino

  spark-master:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLE: "no"
      SPARK_RPC_ENCRYPTION_ENABLE: "no"
      SPARK_SSL_ENABLED: "no"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "7077:7077"   # Spark master RPC
      - "8082:8080"   # Spark master web UI (remapped: 8080 is already Trino's)
      - "4040:4040"   # Spark application (driver) UI — active only while a job runs
    volumes:
      # benchmark_spark.py runs as `spark-submit` inside this container (via
      # `docker compose exec`), not on the host like the other scripts — the
      # host has no JVM, and PySpark's driver needs one even in client mode
      # against a remote master.
      - ./src:/app:ro
    depends_on:
      minio:
        condition: service_healthy

  spark-worker:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2G"
      SPARK_RPC_AUTHENTICATION_ENABLE: "no"
      SPARK_RPC_ENCRYPTION_ENABLE: "no"
      SPARK_SSL_ENABLED: "no"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8083:8081"   # Spark worker web UI
    depends_on:
      - spark-master

volumes:
  minio_data:
  nessie_data: